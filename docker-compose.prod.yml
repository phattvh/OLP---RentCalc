version: '3.8'

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-rentcalc}
      POSTGRES_USER: ${POSTGRES_USER:-rentcalc}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-rentcalc_secret}
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped

  web:
    build: .
    depends_on:
      - db
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-rentcalc}:${POSTGRES_PASSWORD:-rentcalc_secret}@db:5432/${POSTGRES_DB:-rentcalc}
      ENV: production
    ports:
      - "8000:8000"
    command: >
      sh -c "alembic upgrade head && 
             python -m scripts.seed &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers 4"
    restart: unless-stopped

volumes:
  pgdata:
