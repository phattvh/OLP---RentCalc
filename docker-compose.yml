services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: rentcalc
      POSTGRES_USER: rentcalc
      POSTGRES_PASSWORD: rentcalc
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rentcalc"]
      interval: 5s
      retries: 10

  web:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg://rentcalc:rentcalc@db:5432/rentcalc
      SECRET_KEY: ${SECRET_KEY:-rentcalc-docker-secret-key-olp2026}
      ENV: production
    ports:
      - "8000:8000"
    command: >
      sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"

volumes:
  pgdata:
