name: CI Pipeline

on:
  push:
    branches: [ "main", "feat/**" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    name: Build & Test (Python 3.12 + PostgreSQL)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: rentcalc
          POSTGRES_USER: rentcalc
          POSTGRES_PASSWORD: rentcalc
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Alembic database migrations
        env:
          DATABASE_URL: postgresql+psycopg://rentcalc:rentcalc@localhost:5432/rentcalc
          SECRET_KEY: ci-test-secret-key-olp-2026
        run: |
          alembic upgrade head

      - name: Seed test database
        env:
          DATABASE_URL: postgresql+psycopg://rentcalc:rentcalc@localhost:5432/rentcalc
          SECRET_KEY: ci-test-secret-key-olp-2026
        run: |
          python -m scripts.seed

      - name: Run automated test suite with coverage
        env:
          DATABASE_URL: postgresql+psycopg://rentcalc:rentcalc@localhost:5432/rentcalc
          SECRET_KEY: ci-test-secret-key-olp-2026
        run: |
          pytest -v --cov=app --cov-report=term-missing
